# ######################################################################################## #
# Это YML файл. Будьте осторожны при редактировании. Проверяйте свои правки                #
# в YAML валидаторе, например, на http://yaml-online-parser.appspot.com                    #
# ######################################################################################## #

protection:
  flags:
    CHUNKBLOCK_MAGIC_BLOCK:
      name: Магический блок
      description: |-
        <green>Предотвращает ломание</green>
        <green>магического блока</green>
      hint: <red>Ломание магического блока запрещено!</red>
    CHUNKBLOCK_START_SAFETY:
      name: Защита новичков от падений
      description: |-
        <green>Запрещает новичкам двигаться</green>
        <green>в течение 1 минуты</green>
      hint: <red>Движение заблокировано в целях безопасности ещё на [number] секунд!</red>
      free-to-move: <green>Теперь вы можете двигаться. Будьте осторожны!</green>
    CHUNKBLOCK_BOSSBAR:
      name: Боссбар
      description: Показывает статус фазы в боссбаре
    CHUNKBLOCK_ACTIONBAR:
      name: Панель действий
      description: Показывает статус фазы в панели действий
    CHUNKBLOCK_CLAIM_CHUNKS:
      name: Захват Чанков
      description: |-
        <aqua>Ранг, который может потратить
        кредит уровня острова
        для захвата новых чанков.</aqua>
      hint: "<red>Ваш ранг не может захватывать чанки для этого острова!</red>"
chunkblock:
  bossbar:
    title: Осталось блоков
    title-prefix: "[title] | "
    # статус: "<green>Статус фазы <aqua>[total]</aqua>. Осталось: <aqua>[todo]</aqua></green>"
    # статус: "<green>[phase-name] : [percent-done]</green>"
    status: <green>Статус фазы <aqua>[done] <light_purple>/</light_purple> [total]</aqua></green>
    # RED, WHITE, PINK, BLUE, GREEN, YELLOW, or PURPLE
    color: RED
    # SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
    style: SOLID
    not-active: <red>Боссбар отключен на этом острове.</red>
  actionbar:
    status: '<green>Фаза: <aqua>[phase-name]</aqua> <light_purple>|</light_purple> Блоков: <aqua>[done] <light_purple>/</light_purple> [total]</aqua> <light_purple>|</light_purple> Прогресс: <aqua>[percent-done]</aqua></green>'
    not-active: <red>Панель действий отключена на этом острове.</red>
  chunks:
    entry-denied: "<red>Этот чанк заблокирован.</red>"
    locked: "<red>Вы не можете это трогать — чанк заблокирован.</red>"
    claim-hint: "<yellow>Ударьте границу, чтобы захватить этот чанк за </yellow><aqua>[cost] </aqua><yellow>уровень(ей)! У вас есть </yellow><aqua>[credit] </aqua><yellow>уровень(ей) кредита.</yellow>"
    claim-confirm: "<yellow>Захватить этот чанк за </yellow><aqua>[cost] </aqua><yellow>уровень(ей)? Это оставит вас </yellow><aqua>[after] </aqua><yellow>уровень(ей) кредита. </yellow><gold>Встаньте на корточки и ударьте границу еще раз </gold><yellow>в течение </yellow><aqua>[seconds]s </aqua><yellow>для подтверждения.</yellow>"
    no-credit: "<red>Вам нужно </red><aqua>[needed] </aqua><red>больше уровень(ей) кредита, чтобы захватить этот чанк.</red>"
    beyond-limit: "<red>Этот чанк находится за пределами области защиты вашего острова.</red>"
    claimed: "<green><bold>Чанк захвачен! </bold>Ваш остров теперь </green><aqua>[number] </aqua><green>чанков. Остаток кредита: </green><aqua>[credit] </aqua><green>уровень(ей).</green>"
    credit: "<green>Вы можете захватить еще </green><aqua>[count] </aqua><green>чанк(ов)! Идите на границу и ударьте там, где хотите расти.</green>"
    relocked: "<red>Уровень вашего острова упал — [count] чанк(ов) повторно заблокирован, новые первыми. Вернитесь к уровням, чтобы повторно их захватить!</red>"
    ejected: "<red>Чанк, в котором вы были, повторно заблокировался, поэтому вас переместили в безопасное место.</red>"
    max-reached: "<light_purple>Ваш остров достиг максимального размера [number] чанков!</light_purple>"
    ring-complete: "<gold><bold>Кольцо [ring] завершено! </bold>Все кольцо вокруг вашего острова принадлежит вам — </gold><aqua>[chunks] </aqua><gold>чанков всего.</gold>"
    ring-broadcast: "<gold>Остров [name] закрыл кольцо </gold><aqua>[ring] </aqua><gold>— </gold><aqua>[chunks] </aqua><gold>чанков и продолжает расти!</gold>"
    rings: "<green>Завершенные кольца: </green><aqua>[rings] </aqua><green>из </green><aqua>[max]</aqua><green>.</green>"
    ring-progress: "<yellow>Кольцо [ring]: </yellow><aqua>[remaining]</aqua><yellow>/</yellow><aqua>[total]</aqua><yellow> чанков осталось.</yellow>"
    sethome-denied: "<red>Вы не можете установить дом в заблокированном чанке.</red>"
    info: "<green>Чанки: </green><aqua>[unlocked]</aqua><green>/</green><aqua>[max]</aqua><green>. Кредит: </green><aqua>[credit] </aqua><green>уровень(ей) — чанк стоит </green><aqua>[cost]</aqua><green>.</green>"
    map:
      title: "<green>Территория вашего острова ([unlocked]/[max] чанков):</green>"
      row: "<green>[row]</green>"
      legend: "<green>■ ваш </green><yellow>▣ доступный для захвата ([cost] уровень(ей) каждый) </yellow><gray>□ заблокирован </gray><gold>◎ центр </gold><aqua>◆ вы</aqua>"
      you-are-here: "<aqua>Вы находитесь на отмеченном чанке.</aqua>"
    dialog:
      close: "<white>Закрыть"
      view-island: "<gold>Центрировать на острове"
      view-player: "<aqua>Центрировать на вашей позиции"
      pan-north: "<white>Прокрутить карту на север"
      pan-south: "<white>Прокрутить карту на юг"
      pan-east: "<white>Прокрутить карту на восток"
      pan-west: "<white>Прокрутить карту на запад"
      arrow-to-island: "<gold>Центр вашего острова в этом направлении"
      arrow-to-player: "<aqua>Вы находитесь в этом направлении"
      tooltip:
        center: "<gold>Центральный чанк — ваш магический блок здесь.</gold>"
        owned: "<green>Чанк [x], [z] — ваш.</green>"
        claimable: "<yellow>Чанк [x], [z] — доступен для захвата за <aqua>[cost]</aqua> уровень(ей). Идите на эту границу и ударьте.</yellow>"
        no-credit: "<yellow>Чанк [x], [z] — стоит <aqua>[cost]</aqua> уровень(ей). Вам нужно <red>[needed]</red> больше уровень(ей) кредита.</yellow>"
        locked: "<gray>Чанк [x], [z] — заблокирован. Захватите себе путь к нему.</gray>"
        you-are-here: "<aqua>Вы стоите здесь.</aqua>"
  trophies:
    awarded: "<gold><bold>Трофей заработан: </bold></gold>[name]<gold>!</gold>"
    title-available: "<yellow>Ваш остров заработал звание </yellow>[title]<yellow> — переключайте его с помощью </yellow><aqua>/ch title</aqua><yellow>.</yellow>"
  commands:
    admin:
      setcount:
        parameters: <имя> <количество> [lifetime]
        description: установить количество блоков у игрока
        set: <green>Счётчик [name] установлен на [number]</green>
        set-lifetime: <green>Общий счётчик [name] установлен на [number]</green>
      setchest:
        parameters: <фаза> <редкость>
        description: поместить сундук, на который смотрите, в фазу с указанной редкостью
        chest-is-empty: <red>Этот сундук пуст, поэтому его нельзя добавить.</red>
        unknown-phase: <red>Неизвестная фаза. Используйте Tab для подсказки.</red>
        unknown-rarity: <red>Неизвестная редкость. Используйте COMMON, UNCOMMON, RARE или EPIC</red>
        look-at-chest: <red>Посмотрите на заполненный сундук, чтобы установить его.</red>
        only-single-chest: <red>Можно устанавливать только одиночные сундуки.</red>
        success: <green>Сундук успешно добавлен в фазу!</green>
        failure: <red>Не удалось добавить сундук в фазу! Проверьте консоль на наличие ошибок.</red>
      sanity:
        parameters: <фаза>
        description: вывести в консоль проверку вероятностей фазы
        see-console: <green>Смотрите отчёт в консоли.</green>
      bypass:
        description: "переключать принудительное применение блокировки чанков для себя"
        'on': "<green>Вы теперь обходите блокировки чанков. Визуальные границы скрыты от вас.</green>"
        'off': "<green>Блокировки чанков снова применяются к вам.</green>"
      chunks:
        parameters: "<игрок> [reset]"
        description: "проверить разблокированные чанки игрока или заблокировать их обратно в начало"
        info: "<green>[name]: </green><aqua>[number]</aqua><green>/</green><aqua>[max] </aqua><green>чанков, </green><aqua>[spent] </aqua><green>потраченных уровней, </green><aqua>[credit] </aqua><green>кредита.</green>"
        reset: "<green>Чанки [name] были повторно заблокированы только для центрального чанка.</green>"
      phases:
        description: "открыть редактор порядка фаз"
        no-index: "<red>Индекс фаз не загружен, поэтому фазы не могут быть переупорядочены</red>"
        saved: "<green>Порядок фаз сохранен и применен</green>"
        save-failed: "<red>Не удалось сохранить порядок фаз! Проверьте консоль на наличие ошибок</red>"
        gui:
          title: "<dark_green>Порядок Фаз</dark_green>"
          info-title: "<white>Как использовать</white>"
          instructions: |-
            <gray>Нажмите на фазу, чтобы поднять ее,
            затем нажмите, где она должна быть.
            Щелкните правой кнопкой мыши, чтобы переключить фазу
            включении или отключении.</gray>
          repeat: "<gray>После последней фазы счетчик переходит на </gray><aqua>[number]</aqua>"
          phase-name: "<green>[name]</green>"
          start: "<gray>Начало: </gray><aqua>[number]</aqua>"
          length: "<gray>Длина: </gray><aqua>[number]</aqua>"
          disabled: "<red>Отключено</red>"
          version-locked: "<red>Требуется Minecraft [version]+</red>"
          pick-up: "<yellow>Нажмите, чтобы переместить</yellow>"
          toggle: "<yellow>Щелкните правой кнопкой мыши, чтобы переключить</yellow>"
          set-length: "<yellow>Shift + левый клик, чтобы установить длину</yellow>"
          drop-here: "<yellow>Нажмите, чтобы поместить здесь</yellow>"
          drop-at-end: "<green>Поместить в конец</green>"
          held: "<yellow>Перемещение: [name]</yellow>"
          put-back: "<yellow>Нажмите, чтобы положить обратно</yellow>"
          enter-length: "<yellow>Введите новую длину в чат для </yellow><green>[name] </green><yellow>- в настоящее время </yellow><aqua>[number] </aqua><yellow>блоков. Введите </yellow><red>cancel </red><yellow>чтобы сохранить.</yellow>"
          invalid-length: "<red>Длина должна быть целым числом больше 0</red>"
          length-cancelled: "<red>Длина не изменена</red>"
          cancel-word: "cancel"
    chunks:
      description: "показать ваши разблокированные чанки и карту вашей территории"
    ledger:
      description: "показать взносы членов команды"
      parameters: "[days]"
      header: "<green>Реестр вклада острова </green><gray>([window])</gray>"
      all-time: "за все время"
      last-days: "последние [days] дней"
      row: "<gray> - </gray><aqua>[name]</aqua><gray>: </gray><green>[blocks]</green><gray> блоков, </gray><green>[chunks]</green><gray> чанков, </gray><green>[rings]</green><gray> колец</gray>"
      total: "<gold>Итого: </gold><green>[blocks]</green><gold> блоков, </gold><green>[chunks]</green><gold> чанков, </gold><green>[rings]</green><gold> колец</gold>"
      no-activity: "<gray>Пока нет записей об активности.</gray>"
    title:
      description: "переключать звание острова или выбрать один"
      parameters: "[list | trophy-id | none]"
      header: "<green>Трофеи вашего острова:</green>"
      trophy-entry: "<gray> - </gray>[name]"
      title-entry: "<gray> - </gray>[name]<gray> — звание </gray>[title]<gray> (</gray><aqua>/ch title [id]</aqua><gray>)</gray>"
      none-earned-yet: "<gray>Ваш остров еще не заработал ни одного трофея.</gray>"
      active: "<green>Активное звание: </green>[title]"
      no-active: "<gray>Нет активного звания. Выберите один с помощью </gray><aqua>/ch title</aqua><gray>.</gray>"
      set: "<green>Звание вашего острова теперь </green>[title]<green>.</green>"
      cleared: "<green>Ваш остров больше не показывает звание.</green>"
      toggled-on: "<green>Звание острова </green>[title]<green> теперь отображается.</green>"
      toggled-off: "<yellow>Звание острова </yellow>[title]<yellow> теперь скрыто.</yellow>"
      not-earned: "<red>Ваш остров не заработал трофей с этим званием.</red>"
    count:
      description: показать количество вскопано блоков и фазу
      info: <green>Вскопано <aqua>[number]</aqua> блоков на фазе [name]</green>
    info:
      count: <green>Вскопано <aqua>[number]</aqua> блоков на фазе <aqua>[name]</aqua>. Всего сломано <aqua>[lifetime]</aqua>.</green>
    phases:
      description: показать список всех фаз
      title: <dark_green>Фазы ChunkBlock</dark_green>
      name-syntax: <green>[name]</green>
      description-syntax: <aqua>[number] блоков</aqua>
    island:
      bossbar:
        description: вкл/выкл боссбар фазы
        status_on: <green><aqua>Боссбар</aqua> включён</green>
        status_off: <red><aqua>Боссбар</aqua> отключен</red>
      actionbar:
        description: вкл/выкл панель действий фазы
        status_on: <green><aqua>Панель действий</aqua> включена</green>
        status_off: <red><aqua>Панель действий</aqua> отключена</red>
      setcount:
        parameters: <количество>
        description: установить счётчик блоков на ранее завершённое значение
        set: <green>Счётчик установлен на [number].</green>
        too-high: '<red>Максимальное значение, которое вы можете установить: [number]!</red>'
    respawn-block:
      description: восстановить магический блок в случаях, когда он исчезает
      block-exist: <green>Блок существует, восстановление не требовалось.</green>
      block-respawned: <green>Блок восстановлен.</green>
  phase:
    insufficient-level: <red>Уровень вашего острова слишком низок для продолжения! Требуется [number].</red>
    insufficient-funds: <red>Ваши средства слишком малы для продолжения! Требуется [number].</red>
    insufficient-bank-balance: <red>Баланс банка острова слишком низок для продолжения! Требуется [number].</red>
    insufficient-permission: <red>Вы не можете продолжать, пока не получите разрешение [name]!</red>
    cooldown: <red>Следующая фаза станет доступна через [number] секунд!</red>
  placeholders:
    infinite: Бесконечность
    my-island-phase-default: Неизвестно
  gui:
    titles:
      phases: <black><bold>Фазы ChunkBlock</bold></black>
    buttons:
      previous:
        name: <white><bold>Предыдущая страница</bold></white>
        description: <gray>Перейти на страницу [number]</gray>
      next:
        name: <white><bold>Следующая страница</bold></white>
        description: <gray>Перейти на страницу [number]</gray>
      phase:
        name: <white><bold>[phase]</bold></white>
        description: |-
          [starting-block]
          [biome]
          [bank]
          [economy]
          [level]
          [permission]
          [blocks]
        starting-block: <gray>Начинается после разрушения <yellow>[number] </yellow>блоков.</gray>
        biome: '<gray>Биом: <yellow>[biome]</yellow></gray>'
        bank: <gray>Требуется <yellow>$[number] </yellow>на счету банка.</gray>
        economy: <gray>Требуется <yellow>$[number] </yellow>на счёте игрока.</gray>
        level: <gray>Требуется <yellow>[number] </yellow>уровень острова.</gray>
        permission: <gray>Требуется разрешение <yellow>[permission]</yellow>.</gray>
        blocks-prefix: <gray>Блоки - </gray>
        blocks: '<yellow>[name], '
        wrap-at: '50'
    tips:
      click-to-previous: <gray><yellow>Нажмите </yellow>для перехода на предыдущую страницу.</gray>
      click-to-next: <gray><yellow>Нажмите </yellow>для перехода на следующую страницу.</gray>
      click-to-change: <gray><yellow>Нажмите</yellow>, чтобы изменить.</gray>
  island:
    starting-hologram: |-
      <green>Добро пожаловать в ChunkBlock</green>
      <yellow>Разрушьте блок, чтобы начать</yellow>
