protection:
  flags:
    CHUNKBLOCK_MAGIC_BLOCK:
      name: 魔法ブロック保護
      description: |-
        <aqua>ブロックを破壊できる場合、
        魔法ブロックを破壊できる
        ランク。</aqua>
      hint: "<red>あなたのランクでは魔法ブロックを破壊できません！</red>"
    CHUNKBLOCK_START_SAFETY:
      name: 開始時の安全対策
      description: |-
        <aqua>新しいプレイヤーが
        1分間移動するのを防ぎ、
        落下を防ぎます。</aqua>
      hint: "<red>安全のため、あと [number] 秒間移動がブロックされています！</red>"
      free-to-move: "<green>自由に動けます。注意してください！</green>"
    CHUNKBLOCK_BOSSBAR:
      name: ボスバー
      description: |-
        <aqua>各フェーズの
        ステータスバーを表示します。</aqua>
    CHUNKBLOCK_ACTIONBAR:
      name: アクションバー
      description: |-
        <aqua>各フェーズの
        ステータスを
        アクションバーに表示します。</aqua>
    CHUNKBLOCK_CLAIM_CHUNKS:
      name: チャンク認領
      description: |-
        <aqua>島のレベル額度を使用して
        新しいチャンクを認領できる
        ランク。</aqua>
      hint: "<red>あなたのランクではこの島のチャンクを認領できません！</red>"
chunkblock:
  bossbar:
    title: 残りのブロック
    title-prefix: "[title] | "
    status: '位相ブロック <aqua>[done] </aqua><light_purple>/ </light_purple><aqua>[total]</aqua>'
