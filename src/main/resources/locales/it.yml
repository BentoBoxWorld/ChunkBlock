    titles:
      phases: '<black><bold>fasi di un blocco</bold></black>'
    buttons:
      previous:
        name: '& l pagina precedente'
        description: '<gray>Passa alla pagina [number]</gray>'
      next:
        name: '<white><bold>Pagina successiva</bold></white>'
        description: '<gray>Passa alla pagina [number]</gray>'
      phase:
        name: '<white><bold>[phase]</bold></white>'
        description: |-
          [starting-block]
          [biome]
          [bank]
          [economy]
          [level]
          [permission]
          [blocks]
