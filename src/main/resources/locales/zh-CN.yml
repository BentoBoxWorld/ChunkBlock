protection:
  flags:
    CHUNKBLOCK_MAGIC_BLOCK:
      name: 魔法方块保护
      description: |-
        <aqua>如果玩家可以破坏方块，
        则该等级可以破坏
        魔法方块。</aqua>
      hint: "<red>您的等级无法破坏魔法方块！</red>"
    CHUNKBLOCK_START_SAFETY:
      name: 初始安全保护
      description: |-
        <aqua>阻止新玩家在1分钟内
        移动，以防他们跌落。</aqua>
      hint: "<red>出于安全考虑，移动已被阻止 [number] 秒！</red>"
      free-to-move: "<green>您可以自由移动了。请小心！</green>"
    CHUNKBLOCK_BOSSBAR:
      name: Boss 血条
      description: |-
        <aqua>为每个阶段
        显示一个状态条。</aqua>
    CHUNKBLOCK_ACTIONBAR:
      name: 动作栏
      description: |-
        <aqua>在动作栏中
        显示每个阶段
        的状态。</aqua>
    CHUNKBLOCK_CLAIM_CHUNKS:
      name: 领地块
      description: |-
        <aqua>可以消耗岛屿的等级
        信用来领地新块的
        等级。</aqua>
      hint: "<red>您的等级无法为此岛屿领地块！</red>"
chunkblock:
