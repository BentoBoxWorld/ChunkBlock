      click-to-next: '<yellow>Klik </yellow><gray>untuk melihat halaman berikutnya.</gray>'
      click-to-change: '<yellow>Klik </yellow><gray>untuk berubah.</gray>'
  island:
    starting-hologram: |-
      <green>Selamat datang di AONEBLOCK
