protection:
  flags:
    CHUNKBLOCK_MAGIC_BLOCK:
      name: Proteção de Bloco Mágico
      description: |-
        <aqua>Rank que pode quebrar o
        bloco mágico se puder
        quebrar blocos.</aqua>
      hint: "<red>Seu rank não pode quebrar o bloco mágico!</red>"
    CHUNKBLOCK_START_SAFETY:
      name: Segurança Inicial
      description: |-
        <aqua>Impede que novos jogadores
        se movam por 1 minuto
        para que não caiam.</aqua>
      hint: "<red>Movimento bloqueado por segurança por mais [number] segundos!</red>"
      free-to-move: "<green>Você está livre para se mover. Tenha cuidado!</green>"
    CHUNKBLOCK_BOSSBAR:
      name: Boss Bar
      description: |-
        <aqua>Mostra uma barra de status
        para cada fase.</aqua>
    CHUNKBLOCK_ACTIONBAR:
      name: Action Bar
      description: |-
        <aqua>Mostra um status
        para cada fase
        na Action Bar.</aqua>
    CHUNKBLOCK_CLAIM_CHUNKS:
      name: Reivindicar Blocos
      description: |-
        <aqua>Rank que pode gastar o
        crédito de nível da ilha
        para reivindicar novos blocos.</aqua>
      hint: "<red>Seu rank não pode reivindicar blocos para esta ilha!</red>"
chunkblock:
  bossbar:
    title: Bloqueia o restante
    title-prefix: "[title] | "
    status: '<green>Blocos de fase </green><aqua>[done] </aqua><light_purple>/ </light_purple><aqua>[total]</aqua>'
    color: RED
    style: SEGMENTED_20
    not-active: '<red>O Boss Bar não está ativo para esta ilha</red>'
  actionbar:
    status: "<green>Fase: </green><aqua>[phase-name] </aqua><light_purple>| </light_purple><green>Blocos: </green><aqua>[done] </aqua><light_purple>/ </light_purple><aqua>[total] </aqua><light_purple>| </light_purple><green>Progresso: </green><aqua>[percent-done]</aqua>"
    not-active: "<red>A barra de ação não está ativa para esta ilha</red>"
  chunks:
    entry-denied: "<red>Aquele bloco está travado.</red>"
    locked: "<red>Você não pode tocar nisso — o bloco está travado.</red>"
    claim-hint: "<yellow>Acerte a borda para reivindicar este bloco por </yellow><aqua>[cost] </aqua><yellow>nível(ns)! Você tem </yellow><aqua>[credit] </aqua><yellow>nível(ns) de crédito.</yellow>"
    claim-confirm: "<yellow>Reivindicar este bloco por </yellow><aqua>[cost] </aqua><yellow>nível(ns)? Isso deixa você </yellow><aqua>[after] </aqua><yellow>nível(ns) de crédito. </yellow><gold>Esgueirar-se e acertar a borda novamente </gold><yellow>dentro de </yellow><aqua>[seconds]s </aqua><yellow>para confirmar.</yellow>"
    no-credit: "<red>Você precisa </red><aqua>[needed] </aqua><red>de mais nível(ns) de crédito para reivindicar este bloco.</red>"
    beyond-limit: "<red>Aquele bloco está além da área de proteção da sua ilha.</red>"
    claimed: "<green><bold>Bloco reivindicado! </bold>Sua ilha tem agora </green><aqua>[number] </aqua><green>blocos. Crédito restante: </green><aqua>[credit] </aqua><green>nível(ns).</green>"
    credit: "<green>Você pode reivindicar </green><aqua>[count] </aqua><green>bloco(s) a mais! Vá para sua borda e acerte onde quer crescer.</green>"
    relocked: "<red>O nível da sua ilha caiu — [count] bloco(s) travado(s) novamente, mais recentes primeiro. Reganha os níveis para reivindicá-los de volta!</red>"
    ejected: "<red>O bloco em que você estava se trancou, então você foi movido para um local seguro.</red>"
    max-reached: "<light_purple>Sua ilha atingiu o tamanho máximo de [number] blocos!</light_purple>"
    ring-complete: "<gold><bold>Anel [ring] completo! </bold>Todo o anel ao redor da sua ilha é seu — </gold><aqua>[chunks] </aqua><gold>blocos ao todo.</gold>"
    ring-broadcast: "<gold>A ilha de [name] fechou o anel </gold><aqua>[ring] </aqua><gold>— </gold><aqua>[chunks] </aqua><gold>blocos e ainda crescendo!</gold>"
    rings: "<green>Anéis concluídos: </green><aqua>[rings] </aqua><green>de </green><aqua>[max]</aqua><green>.</green>"
    ring-progress: "<yellow>Anel [ring]: </yellow><aqua>[remaining]</aqua><yellow>/</yellow><aqua>[total]</aqua><yellow> blocos a partir.</yellow>"
    sethome-denied: "<red>Você não pode definir uma home em um bloco travado.</red>"
    info: "<green>Blocos: </green><aqua>[unlocked]</aqua><green>/</green><aqua>[max]</aqua><green>. Crédito: </green><aqua>[credit] </aqua><green>nível(ns) — um bloco custa </green><aqua>[cost]</aqua><green>.</green>"
    map:
      title: "<green>Seu território de ilha ([unlocked]/[max] blocos):</green>"
      row: "<green>[row]</green>"
      legend: "<green>■ seu </green><yellow>▣ reivindicável ([cost] nível(ns) cada) </yellow><gray>□ travado </gray><gold>◎ centro </gold><aqua>◆ você</aqua>"
      you-are-here: "<aqua>Você está no bloco marcado.</aqua>"
    dialog:
      close: "<white>Fechar"
      view-island: "<gold>Centralizar na ilha"
      view-player: "<aqua>Centralizar na sua posição"
      arrow-to-island: "<gold>O centro da sua ilha está nesta direção"
      arrow-to-player: "<aqua>Você está nesta direção"
      tooltip:
        center: "<gold>O bloco do centro — seu bloco mágico está aqui."
        owned: "<green>Bloco [x], [z] — seu."
        claimable: "<yellow>Bloco [x], [z] — reivindicável por <aqua>[cost]</aqua> nível(ns). Vá para aquela borda e acerte.</yellow>"
        no-credit: "<yellow>Bloco [x], [z] — custos <aqua>[cost]</aqua> nível(ns). Você precisa de <red>[needed]</red> mais nível(ns) de crédito.</yellow>"
        locked: "<gray>Bloco [x], [z] — travado. Reivindique seu caminho para fora para isso.</gray>"
        you-are-here: "<aqua>Você está em pé aqui.</aqua>"
  trophies:
    awarded: "<gold><bold>Troféu conquistado: </bold></gold>[name]<gold>!</gold>"
    title-available: "<yellow>Sua ilha ganhou o título </yellow>[title]<yellow> — alterne-o em </yellow><aqua>/ch title</aqua><yellow>.</yellow>"
  commands:
    admin:
      setcount:
        parameters: <name> <count>
        description: definir contagem de blocos do jogador
        set: '<green>[name] contagem definida para [number]</green>'
        set-lifetime: '<green>A contagem de vida útil [name] definida como [number]</green>'
      setchest:
        parameters: <phase> <rarity>
        description: colocar o baú olhado em uma fase com a raridade especificada
        chest-is-empty: '<red>Esse baú está vazio, então não pode ser adicionado</red>'
        unknown-phase: '<red>Fase desconhecida. Use tab-complete para vê-los</red>'
        unknown-rarity: '<red>Raridade desconhecida. Use COMMON, UNCOMMON, RARE ou EPIC</red>'
        look-at-chest: '<red>Olhe para um baú cheio para configurá-lo</red>'
        only-single-chest: '<red>Apenas baús individuais podem ser ajustados</red>'
        success: '<green>Baú adicionado com sucesso à fase</green>'
        failure: '<red>O Bau não pôde ser adicionado à fase! Veja o console para erros</red>'
      sanity:
        parameters: <phase>
        description: >-
          exibir uma verificação de sanidade das probabilidades de fase no
          console
        see-console: '<green>Veja o console para o relatório</green>'
      bypass:
        description: "ativar/desativar a aplicação de bloqueio de blocos para você"
        'on': "<green>Você agora desvia dos bloqueios de blocos. Visuais de borda estão ocultos para você.</green>"
        'off': "<green>Os bloqueios de blocos se aplicam a você novamente.</green>"
      chunks:
        parameters: "<jogador> [reset]"
        description: "inspecionar os blocos desbloqueados de um jogador ou reconectá-los ao início"
        info: "<green>[name]: </green><aqua>[number]</aqua><green>/</green><aqua>[max] </aqua><green>blocos, </green><aqua>[spent] </aqua><green>níveis gastos, </green><aqua>[credit] </aqua><green>crédito.</green>"
        reset: "<green>Os blocos de [name] foram retravados de volta ao bloco do centro.</green>"
      phases:
        description: "abrir o editor de ordem de fases"
        no-index: "<red>Nenhum índice de fase está carregado, portanto as fases não podem ser reordenadas</red>"
        saved: "<green>Ordem de fase salva e aplicada</green>"
        save-failed: "<red>Não foi possível salvar a ordem de fase! Veja o console para erros</red>"
        gui:
          title: "<dark_green>Ordem de Fase</dark_green>"
          info-title: "<white>Como usar</white>"
          instructions: |-
            <gray>Clique em uma fase para pegá-la,
            depois clique onde ela deve ir.
            Clique com o botão direito para alternar uma fase
            ligada ou desligada.</gray>
          repeat: "<gray>Após a última fase, a contagem salta para </gray><aqua>[number]</aqua>"
          phase-name: "<green>[name]</green>"
          start: "<gray>Início: </gray><aqua>[number]</aqua>"
          length: "<gray>Comprimento: </gray><aqua>[number]</aqua>"
          disabled: "<red>Desativado</red>"
          version-locked: "<red>Precisa de Minecraft [version]+</red>"
          pick-up: "<yellow>Clique para mover</yellow>"
          toggle: "<yellow>Clique com o botão direito para alternar</yellow>"
          set-length: "<yellow>Shift-clique esquerdo para definir comprimento</yellow>"
          drop-here: "<yellow>Clique para soltar aqui</yellow>"
          drop-at-end: "<green>Soltar no final</green>"
          held: "<yellow>Movendo: [name]</yellow>"
          put-back: "<yellow>Clique para colocar de volta</yellow>"
          enter-length: "<yellow>Digite um novo comprimento no bate-papo para </yellow><green>[name] </green><yellow>- atualmente é </yellow><aqua>[number] </aqua><yellow>blocos. Digite </yellow><red>cancel </red><yellow>para mantê-lo.</yellow>"
          invalid-length: "<red>O comprimento deve ser um número inteiro acima de 0</red>"
          length-cancelled: "<red>Comprimento não alterado</red>"
          cancel-word: "cancel"
    chunks:
      description: "mostrar seus blocos desbloqueados e um mapa de seu território"
    ledger:
      description: "mostrar contribuições de membros da equipe"
      parameters: "[days]"
      header: "<green>Razão de Contribuição da Ilha </green><gray>([window])</gray>"
      all-time: "a todo o tempo"
      last-days: "últimos [days] dias"
      row: "<gray> - </gray><aqua>[name]</aqua><gray>: </gray><green>[blocks]</green><gray> blocos, </gray><green>[chunks]</green><gray> blocos, </gray><green>[rings]</green><gray> anéis</gray>"
      total: "<gold>Total: </gold><green>[blocks]</green><gold> blocos, </gold><green>[chunks]</green><gold> blocos, </gold><green>[rings]</green><gold> anéis</gold>"
      no-activity: "<gray>Nenhuma atividade registrada ainda.</gray>"
    title:
      description: "alterne o título da sua ilha ou escolha um"
      parameters: "[list | trophy-id | none]"
      header: "<green>Troféus da sua ilha:</green>"
      trophy-entry: "<gray> - </gray>[name]"
      title-entry: "<gray> - </gray>[name]<gray> — título </gray>[title]<gray> (</gray><aqua>/ch title [id]</aqua><gray>)</gray>"
      none-earned-yet: "<gray>Sua ilha não ganhou nenhum troféu ainda.</gray>"
      active: "<green>Título ativo: </green>[title]"
      no-active: "<gray>Nenhum título ativo. Escolha um com </gray><aqua>/ch title</aqua><gray>.</gray>"
      set: "<green>O título da sua ilha é agora </green>[title]<green>.</green>"
      cleared: "<green>Sua ilha não mostra mais um título.</green>"
      toggled-on: "<green>Título da ilha </green>[title]<green> agora está mostrando.</green>"
      toggled-off: "<yellow>Título da ilha </yellow>[title]<yellow> agora está oculto.</yellow>"
      not-earned: "<red>Sua ilha não ganhou um troféu com esse título.</red>"
    count:
      description: mostra a contagem de blocos e a fase
      info: '<green>Você está no bloco </green><aqua>[number] no </aqua><green>[name] fase</green>'
    info:
      count: '<green>A ilha está em bloco </green><aqua>[number] </aqua><green>na fase </green><aqua>[name]. Lifetime count [lifetime] </aqua><green>.</green>'
    phases:
      description: mostra uma lista de todas as fases
      title: '<dark_green>ChunkBlock Fases</dark_green>'
      name-syntax: '<green>[name]</green>'
      description-syntax: '<aqua>[number] blocos</aqua>'
    island:
      bossbar:
        description: Alterna o Boss Boss Bar
        status_on: '<aqua>Bossbar </aqua><green>ligado</green>'
        status_off: '<aqua>Bossbar </aqua><red>desligado</red>'
      actionbar:
        description: alterna a barra de ação de fase
        status_on: "<aqua>Barra de ação </aqua><green>ativada</green>"
        status_off: "<aqua>Barra de ação </aqua><red>desativada</red>"
      setcount:
        parameters: <count>
        description: Defina a contagem de blocos para o valor previamente concluído
        set: '<green>Contagem definida como [number].</green>'
        too-high: '<red>O máximo que você pode definir é [number]!</red>'
    respawn-block:
      description: Responda o bloco mágico em situações quando desaparece
      block-exist: '<green>O bloco existe, não exigiu reaparecimento. </green>'
      block-respawned: '<green>Bloquear o reaparecido.</green>'
  phase:
    insufficient-level: '<red>O nível da sua ilha é muito baixo para prosseguir! </red>'
    insufficient-funds: '<red>Seus fundos são muito baixos para prosseguir! </red>'
    insufficient-bank-balance: '<red>O saldo do banco da ilha é muito baixo para prosseguir! </red>'
    insufficient-permission: '<red>Você não pode proceder mais até obter a permissão [name]!</red>'
    cooldown: '<red>A próxima fase estará disponível em [number] segundos!</red>'
  placeholders:
    infinite: Infinito
    my-island-phase-default: Desconhecida
  gui:
    titles:
      phases: Oneblock Fases
    buttons:
      previous:
        name: '<white><bold>Página anterior</bold></white>'
        description: '<gray>Mudar para a página [number]</gray>'
      next:
        name: '<white><bold>Próxima página</bold></white>'
        description: '<gray>Mudar para a página [number]</gray>'
      phase:
        name: '<white><bold>[phase]</bold></white>'
        description: |-
          [starting-block]
          [biome]
          [bank]
          [economy]
          [level]
          [permission]
          [blocks]
        starting-block: '<gray>Começa após quebrar </gray><yellow>blocos [number].</yellow>'
        biome: '<gray>Bioma: [biome]</gray>'
        bank: '<gray>Requer </gray><yellow>$ [number] </yellow><gray>na conta bancária.</gray>'
        economy: '<gray>Requer </gray><yellow>$ [number] </yellow><gray>na conta do jogador.</gray>'
        level: '<gray>Requer </gray><yellow>[number] </yellow><gray>no nível da ilha.</gray>'
        permission: '<gray>Requer `</gray><yellow>[permission]</yellow><gray>` permissão.</gray>'
        blocks-prefix: '<gray>Blocos em fase -</gray>'
        blocks: '<yellow>[name], </yellow>'
        wrap-at: '50'
    tips:
      click-to-previous: '<yellow>Clique </yellow><gray>para visualizar a página anterior.</gray>'
      click-to-next: '<yellow>Clique </yellow><gray>para visualizar a próxima página.</gray>'
      click-to-change: '<yellow>Clique </yellow><gray>para alterar.</gray>'
  island:
    starting-hologram: |-
      <green>Bem -vindo ao ChunkBlock
      </green><yellow>Quebre este bloco para começar</yellow>
