          repeat: "<gray>Po ostatniej fazie liczba przechodzi do </gray><aqua>[number]</aqua>"
          phase-name: "<green>[name]</green>"
          start: "<gray>Start: </gray><aqua>[number]</aqua>"
          length: "<gray>Długość: </gray><aqua>[number]</aqua>"
          disabled: "<red>Wyłączone</red>"
          version-locked: "<red>Wymaga Minecraft [version]+</red>"
          pick-up: "<yellow>Kliknij, aby przenieść</yellow>"
          toggle: "<yellow>Prawy klik, aby przełączyć</yellow>"
          set-length: "<yellow>Shift + lewy klik, aby ustawić długość</yellow>"
          drop-here: "<yellow>Kliknij, aby upuścić tutaj</yellow>"
          drop-at-end: "<green>Upuść na koniec</green>"
          held: "<yellow>Przenoszenie: [name]</yellow>"
          put-back: "<yellow>Kliknij, aby odłożyć</yellow>"
          enter-length: "<yellow>Wprowadź nową długość na czacie dla </yellow><green>[name] </green><yellow>- aktualnie </yellow><aqua>[number] </aqua><yellow>bloków. Wpisz </yellow><red>cancel </red><yellow>aby zachować.</yellow>"
