        description: "przełącz egzekwowanie blokady kawałków na siebie"
        'on': "<green>Teraz omijasz blokady kawałków. Wizualne granice są ukryte dla Ciebie.</green>"
        'off': "<green>Blokady kawałków ponownie się do Ciebie stosują.</green>"
      chunks:
        parameters: "<gracz> [reset]"
        description: "zbadaj odblokowane kawałki gracza lub zablokuj je z powrotem do początku"
        info: "<green>[name]: </green><aqua>[number]</aqua><green>/</green><aqua>[max] </aqua><green>kawałków, </green><aqua>[spent] </aqua><green>wydanych poziomów, </green><aqua>[credit] </aqua><green>kredytu.</green>"
        reset: "<green>Kawałki [name] zostały ponownie zablokowane do tylko kawałka centralnego.</green>"
      phases:
        description: "otwórz edytor kolejności faz"
        no-index: "<red>Indeks fazy nie jest załadowany, więc nie można zmienić kolejności faz</red>"
