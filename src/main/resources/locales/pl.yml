protection:
  flags:
    CHUNKBLOCK_MAGIC_BLOCK:
      name: Ochrona Magicznego Bloku
      description: |-
        <aqua>Ranga, która może zniszczyć
        magiczny blok, jeśli
        może niszczyć bloki.</aqua>
      hint: "<red>Twoja ranga nie może zniszczyć magicznego bloku!</red>"
    CHUNKBLOCK_START_SAFETY:
      name: Bezpieczeństwo Początkowe
      description: |-
        <aqua>Zapobiega poruszaniu się
        nowym graczom przez 1 minutę,
        aby nie spadli.</aqua>
      hint: "<red>Ruch zablokowany ze względów bezpieczeństwa na kolejne [number] sekund!</red>"
      free-to-move: "<green>Możesz się swobodnie poruszać. Bądź ostrożny!</green>"
    CHUNKBLOCK_BOSSBAR:
      name: Pasek Bossa
      description: |-
        <aqua>Pokazuje pasek statusu
        dla każdej fazy.</aqua>
    CHUNKBLOCK_ACTIONBAR:
      name: Pasek Akcji
      description: |-
        <aqua>Pokazuje status
        dla każdej fazy
        na Pasku Akcji.</aqua>
    CHUNKBLOCK_CLAIM_CHUNKS:
      name: Rościj Kawałki
      description: |-
        <aqua>Ranga, która może wydać
        kredyt poziomu wyspy
        do roszczenia nowych kawałków.</aqua>
      hint: "<red>Twoja ranga nie może rościć kawałków dla tej wyspy!</red>"
chunkblock:
  bossbar:
    title: Pozostałe bloki
    title-prefix: "[title] | "
    status: '<green>Bloki fazowe </green><aqua>[done] </aqua><light_purple>/ </light_purple><aqua>[total]</aqua>'
    color: RED
    style: SEGMENTED_20
    not-active: '<red>Boss Bar nie jest aktywny dla tej wyspy</red>'
  actionbar:
    status: "<green>Faza: </green><aqua>[phase-name] </aqua><light_purple>| </light_purple><green>Bloki: </green><aqua>[done] </aqua><light_purple>/ </light_purple><aqua>[total] </aqua><light_purple>| </light_purple><green>Postęp: </green><aqua>[percent-done]</aqua>"
    not-active: "<red>Pasek akcji nie jest aktywny dla tej wyspy</red>"
  chunks:
    entry-denied: "<red>Ten kawałek jest zablokowany.</red>"
    locked: "<red>Nie możesz go dotknąć — kawałek jest zablokowany.</red>"
    claim-hint: "<yellow>Uderz w granicę, aby rościć ten kawałek za </yellow><aqua>[cost] </aqua><yellow>poziomu! Masz </yellow><aqua>[credit] </aqua><yellow>poziomów kredytu.</yellow>"
    claim-confirm: "<yellow>Rościć ten kawałek za </yellow><aqua>[cost] </aqua><yellow>poziomu? Zostawia Ci </yellow><aqua>[after] </aqua><yellow>poziomów kredytu. </yellow><gold>Ukradkiem i uderz w granicę ponownie </gold><yellow>w ciągu </yellow><aqua>[seconds]s </aqua><yellow>aby potwierdzić.</yellow>"
    no-credit: "<red>Potrzebujesz </red><aqua>[needed] </aqua><red>więcej poziomów kredytu, aby rościć ten kawałek.</red>"
    beyond-limit: "<red>Ten kawałek jest poza obszarem ochrony Twojej wyspy.</red>"
    claimed: "<green><bold>Kawałek roścignięty! </bold>Twoja wyspa ma teraz </green><aqua>[number] </aqua><green>kawałków. Pozostały kredyt: </green><aqua>[credit] </aqua><green>poziomów.</green>"
    credit: "<green>Możesz rościć </green><aqua>[count] </aqua><green>więcej kawałków! Idź do swojej granicy i uderz tam, gdzie chcesz rosnąć.</green>"
    relocked: "<red>Poziom Twojej wyspy spadł — [count] kawałków ponownie zablokowanych, najnowsze najpierw. Odzyskaj poziomy, aby je odblokować!</red>"
    ejected: "<red>Kawałek, w którym byłeś, ponownie się zablokował, więc zostałeś przeniesiony w bezpieczne miejsce.</red>"
    max-reached: "<light_purple>Wyspa osiągnęła maksymalny rozmiar [number] kawałków!</light_purple>"
    ring-complete: "<gold><bold>Pierścień [ring] ukończony! </bold>Cały pierścień wokół Twojej wyspy jest Twój — </gold><aqua>[chunks] </aqua><gold>kawałków w sumie.</gold>"
    ring-broadcast: "<gold>Wyspa [name] zamknęła pierścień </gold><aqua>[ring] </aqua><gold>— </gold><aqua>[chunks] </aqua><gold>kawałków i wciąż rośnie!</gold>"
    rings: "<green>Pierścienie ukończone: </green><aqua>[rings] </aqua><green>z </green><aqua>[max]</aqua><green>.</green>"
    ring-progress: "<yellow>Pierścień [ring]: </yellow><aqua>[remaining]</aqua><yellow>/</yellow><aqua>[total]</aqua><yellow> kawałków zostało.</yellow>"
    sethome-denied: "<red>Nie możesz ustawić domu w zablokowanym kawałku.</red>"
    info: "<green>Kawałki: </green><aqua>[unlocked]</aqua><green>/</green><aqua>[max]</aqua><green>. Kredyt: </green><aqua>[credit] </aqua><green>poziomów — kawałek kosztuje </green><aqua>[cost]</aqua><green>.</green>"
    map:
      title: "<green>Terytorium Twojej wyspy ([unlocked]/[max] kawałków):</green>"
      row: "<green>[row]</green>"
      legend: "<green>■ Twój </green><yellow>▣ Możliwy do roszczenia ([cost] poziomu każdy) </yellow><gray>□ Zablokowany </gray><gold>◎ Centrum </gold><aqua>◆ Ty</aqua>"
      you-are-here: "<aqua>Jesteś na zaznaczonym kawałku.</aqua>"
    dialog:
      close: "<white>Zamknij"
      view-island: "<gold>Wyśrodkuj na wyspę"
      view-player: "<aqua>Wyśrodkuj na twoją pozycję"
      pan-north: "<white>Przewiń mapę na północ"
      pan-south: "<white>Przewiń mapę na południe"
      pan-east: "<white>Przewiń mapę na wschód"
      pan-west: "<white>Przewiń mapę na zachód"
      arrow-to-island: "<gold>Centrum twojej wyspy jest w tym kierunku"
      arrow-to-player: "<aqua>Jesteś w tym kierunku"
      tooltip:
        center: "<gold>Kawałek centralny — Twój magiczny blok jest tutaj."
        owned: "<green>Kawałek [x], [z] — Twój."
        claimable: "<yellow>Kawałek [x], [z] — możliwy do roszczenia za <aqua>[cost]</aqua> poziomów. Idź do tej granicy i uderz ją."
        no-credit: "<yellow>Kawałek [x], [z] — kosztuje <aqua>[cost]</aqua> poziomów. Potrzebujesz <red>[needed]</red> więcej poziomów kredytu."
