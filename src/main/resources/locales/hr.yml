        saved: "<green>Red faza je sačuvan i primijenjen</green>"
        save-failed: "<red>Nije moguće spremiti red faza! Pogledaj konzolu za greške</red>"
        gui:
          title: "<dark_green>Red Faza</dark_green>"
          info-title: "<white>Kako se koristi</white>"
          instructions: |-
            <gray>Klikni na fazu da je podigneš,
            zatim klikni gdje bi trebala ići.
            Desni klik uključuje/isključuje fazu.</gray>
          repeat: "<gray>Nakon posljednje faze brojač se premješta u </gray><aqua>[number]</aqua>"
          phase-name: "<green>[name]</green>"
          start: "<gray>Početak: </gray><aqua>[number]</aqua>"
          length: "<gray>Dužina: </gray><aqua>[number]</aqua>"
          disabled: "<red>Onemogućeno</red>"
          version-locked: "<red>Trebam Minecraft [version]+</red>"
          pick-up: "<yellow>Klikni za pomicanje</yellow>"
          toggle: "<yellow>Desni klik za prebacivanje</yellow>"
          set-length: "<yellow>Shift-lijevi klik za postavljanje dužine</yellow>"
          drop-here: "<yellow>Klikni za spuštanje ovdje</yellow>"
          drop-at-end: "<green>Spusti na kraju</green>"
          held: "<yellow>Pomicanje: [name]</yellow>"
          put-back: "<yellow>Klikni za vraćanje</yellow>"
          enter-length: "<yellow>Unesi novu dužinu u chat za </yellow><green>[name] </green><yellow>- trenutno je </yellow><aqua>[number] </aqua><yellow>blokova. Upiši </yellow><red>cancel </red><yellow>da ga održiš.</yellow>"
          invalid-length: "<red>Dužina mora biti cijeli broj veći od 0</red>"
          length-cancelled: "<red>Dužina nepromijenjena</red>"
          cancel-word: "cancel"
      setcount:
        parameters: <ime> <broj>
        description: postavljanje broja blokova igrača
        set: '<green>broj [name] postavljen je na [number]</green>'
        set-lifetime: '<aqua>roj životnog vijeka [name] postavljen na [number]</aqua>'
      setchest:
        parameters: <phase> <rarity>
        description: stavite pregledani sanduk u fazu s specificiranom rijetkošću
        chest-is-empty: '<red>Taj je škrinja prazna pa se ne može dodati</red>'
        unknown-phase: '<red>Nepoznata faza. Da biste ih vidjeli, upotrijebite karticu</red>'
        unknown-rarity: '<red>Nepoznata rijetkost. Koristite COMMON, UNCOMMON, RARE ili EPIC</red>'
        look-at-chest: '<red>Pogledajte napunjen škrinju da ga postavite</red>'
        only-single-chest: '<red>Mogu se postaviti samo pojedinačne škrinje</red>'
        success: '<green>Komoda uspješno dodana u fazu</green>'
        failure: '<red>Grudište se nije moglo dodati u fazu! Pogledajte konzolu za pogreške</red>'
      sanity:
        parameters: <Faza>
        description: prikazati provjeru ispravnosti faznih vjerojatnosti u konzoli
        see-console: '<green>Pogledajte konzolu za izvješće</green>'
    count:
      description: prikazuju broj i fazu bloka
      info: '<green>Nalazite se na bloku </green><aqua>[number] u fazi </aqua><green>[name]</green>'
    info:
      count: '<green>Otok je u bloku </green><aqua>[number]</aqua><green> u </green><aqua>[name] </aqua><green>fazi. Životni vijek </green><aqua>[lifetime] </aqua><green>.</green>'
