protection:
  flags:
    MAGIC_BLOCK:
      name: 魔法方塊保護
      description: '&b 如果玩家可以破壞方塊，

        &b 則該等級可以破壞

        &b 魔法方塊。'
      hint: '&c 您的等級無法破壞魔法方塊！'
    CHUNKBLOCK_START_SAFETY:
      name: 初始安全保護
      description: '&b 阻止新玩家在1分鐘內

        &b 移動，以防他們跌落。'
      hint: '&c 出於安全考慮，移動已被阻止 [number] 秒！'
      free-to-move: '&a 您可以自由移動了。請小心！'
    CHUNKBLOCK_BOSSBAR:
      name: Boss 血條
      description: '&b 為每個階段

        &b 顯示一個狀態條。'
    CHUNKBLOCK_ACTIONBAR:
      name: 動作欄
      description: '&b 在動作欄中

        &b 顯示每個階段

        &b 的狀態。'
    CHUNKBLOCK_CLAIM_CHUNKS:
      name: 認領區塊
      description: '&b 可花費島嶼的等級額度

        &b 認領新區塊

        &b 的身分組。'
      hint: '&c 你的身分組無法為這座島嶼認領區塊！'
chunkblock:
  bossbar:
    title: 剩餘的塊
    status: '&a 相位塊&b [done] &d / &b [total]'
    color: RED
    style: SEGMENTED_20
    not-active: '&c 老闆酒吧對這個島不活躍'
  actionbar:
    status: '&a 階段: &b [phase-name] &d | &a 方塊數: &b [done] &d / &b [total] &d | &a 進度: &b [percent-done]'
    not-active: '&c 該島嶼的動作欄未啟用'
  commands:
    admin:
      setcount:
        parameters: <名稱> <計數>
        description: 設置玩家的蓋帽數
        set: a [name]的計數設置為[number]
        set-lifetime: '&a [name] 的生命週期計數設定為 [number]'
      setchest:
        parameters: <階段> <稀有>
        description: 將所看的箱子放在指定稀有度的階段
        chest-is-empty: ＆c該箱子為空，因此無法添加
        unknown-phase: ＆c未知階段。使用製表符完成功能來查看它們
        unknown-rarity: ＆c未知稀有。使用COMMON，UNCOMMON，RARE或EPIC
        look-at-chest: ＆c看看裝滿的箱子
        only-single-chest: ＆c只能設置單個箱子
        success: '&a 箱子成功添加'
        failure: ＆c 無法將胸部添加到該階段！ 請參閱控制台以獲取錯誤
      sanity:
        parameters: <階段>
        description: 在控制台中顯示相概率的健全性檢查
        see-console: ＆a請參閱控制台以獲取報告
      bypass:
        description: 切換你自己是否受區塊鎖定限制
        'off': '&a 區塊鎖定已重新套用在你身上。'
        'on': '&a 你現在可以無視區塊鎖定，且邊界視覺效果對你隱藏。'
      chunks:
        description: 查看玩家已解鎖的區塊，或將其重新鎖回起始狀態
        info: '&a [name]：&b [number]&a/&b[max] &a 個區塊，已花費 &b [spent] &a 點等級，剩餘額度 &b [credit] &a 點。'
        parameters: <玩家> [reset]
        reset: '&a [name] 的區塊已重新鎖回只剩中心區塊。'
      phases:
        description: 開啟階段順序編輯器
        no-index: '&c 尚未載入階段索引，因此無法重新排序階段'
        save-failed: '&c 無法儲存階段順序！請查看主控台錯誤訊息'
        saved: '&a 階段順序已儲存並套用'
        gui:
          cancel-word: cancel
          disabled: '&c 已停用'
          drop-at-end: '&a 放到最後'
          drop-here: '&e 點擊以放置於此'
          enter-length: '&e 請在聊天室輸入 &a [name] &e 的新長度－目前為 &b [number] &e 個方塊。輸入 &c cancel &e 可保持不變。'
          held: '&e 移動中：[name]'
          info-title: '&f 使用方式'
          instructions: '&7 點擊一個階段以拿起它，\n&7 再點擊要放置的位置。\n&7 右鍵點擊可切換\n&7 階段的啟用/停用。'
          invalid-length: '&c 長度必須是大於 0 的整數'
          length: '&7 長度：&b [number]'
          length-cancelled: '&c 長度未變更'
          phase-name: '&a [name]'
          pick-up: '&e 點擊以移動'
          put-back: '&e 點擊以放回'
          repeat: '&7 最後一個階段結束後，計數將跳至 &b [number]'
          set-length: '&e Shift + 左鍵點擊以設定長度'
          start: '&7 起始：&b [number]'
          title: '&2 階段順序'
          toggle: '&e 右鍵點擊以切換'
          version-locked: '&c 需要 Minecraft [version]+'
    count:
      description: 顯示塊數和相位
      info: '&a您正在&a[name]]階段中阻止&b[number]'
    info:
      count: '&a 島位於 &b [names] &a 階段的 &b [number]&a 區塊。生命週期計數 &b [lifetime] &a。'
    phases:
      description: 顯示所有階段的列表
      title: ＆2 OneBlock階段
      name-syntax: '&a [name]'
      description-syntax: '&b [number]塊'
    island:
      bossbar:
        description: 切換相位欄
        status_on: '&b Bossbar&a 打開'
        status_off: '&b Bossbar&c 關閉'
      actionbar:
        description: 切換階段動作欄
        status_on: '&b 動作欄已 &a 開啟'
        status_off: '&b 動作欄已 &c 關閉'
      setcount:
        parameters: <計數>
        description: 將區塊計數設定為之前完成的值
        set: '&a 計數設定為 [number]。'
        too-high: '&c 您可以設定的最大值是[number]！'
    respawn-block:
      description: 在魔法塊消失的情況下重生
      block-exist: '&a 塊存在，不需要重生。我給你標記了。'
      block-respawned: '&a 塊重生。'
    chunks:
      description: 顯示你已解鎖的區塊與你的領土地圖
  phase:
    insufficient-level: '&c 你的島嶼等級太低，無法繼續！必須是[number]。'
    insufficient-funds: '&c 您的資金太低，無法繼續！他們必須是[數字]。'
    insufficient-bank-balance: '&c 島上銀行餘額太低，無法繼續！必須是[number]。'
    insufficient-permission: '&c 在獲得 [name] 許可之前，您不能繼續操作！'
    cooldown: '&c [number] 秒後即可進入下一階段！'
  placeholders:
    infinite: 無窮
    my-island-phase-default: 未知
  gui:
    titles:
      phases: '&0&l OneBlock 階段'
    buttons:
      previous:
        name: '&f&l 上一頁'
        description: '&7 切換到[number]頁'
      next:
        name: '&f&l 下一頁'
        description: '&7 切換到[number]頁'
      phase:
        name: '&f&l [階段]'
        description: '[starting-block]

          [biome]

          [bank]

          [economy]

          [level]

          [permission]'
        starting-block: '&7 在破壞 &e [number] 區塊後開始。'
        biome: '&7 生物群落：&e [biome]'
        bank: '&7 需要銀行帳戶中有 &e $[number] &7。'
        economy: '&7 需要玩家帳號中有 &e $[number] &7。'
        level: '&7 需要 &e [number] &7 島嶼等級。'
        permission: '&7 需要 `&e[permission]&7` 權限。'
        blocks-prefix: '&7 階段塊 - '
        blocks: '&e [name], '
        wrap-at: '50'
    tips:
      click-to-previous: '&e 點選&7 查看上一頁。'
      click-to-next: '&e 點選&7 查看下一頁。'
      click-to-change: '&e 點選 &7 進行更改。'
  island:
    starting-hologram: '&a歡迎來到 ChunkBlock

      打破此區塊以開始(&E)'
  chunks:
    beyond-limit: '&c 那個區塊超出你的島嶼保護範圍。'
    claim-confirm: '&e 要花費 &b [cost] &e 點等級額度認領這個區塊嗎？認領後你將剩下 &b [after] &e 點額度。&6請潛行並在 &e &b [seconds]s &e 內再次撞擊邊界以確認。'
    claim-hint: '&e 撞擊邊界即可花費 &b [cost] &e 點等級額度認領這個區塊！你目前有 &b [credit] &e 點額度。'
    claimed: '&a &l 區塊已認領！&r&a 你的島嶼現在有 &b [number] &a 個區塊。剩餘額度：&b [credit] &a 點等級。'
    credit: '&a 你還可以認領 &b [count] &a 個區塊！前往你的邊界，朝想擴張的方向撞擊它。'
    ejected: '&c 你所在的區塊被重新鎖定，因此你已被移動到安全地點。'
    entry-denied: '&c 那個區塊已被鎖定。'
    info: '&a 區塊：&b [unlocked]&a/&b[max]&a。額度：&b [credit] &a 點等級 — 認領一個區塊需要 &b [cost]&a。'
    locked: '&c 你無法碰觸那裡 — 該區塊已被鎖定。'
    map:
      legend: '&a ■ 你的 &e ▣ 可認領（每個 [cost] 點等級） &7 □ 已鎖定'
      row: '&a [row]'
      title: '&a 你的島嶼領土（[unlocked]/[max] 個區塊）：'
      you-are-here: '&b 你目前站在標記的區塊上。'
    max-reached: '&d 你的島嶼已達到最大尺寸 [number] 個區塊！'
    no-credit: '&c 你還需要 &b [needed] &c 點等級額度才能認領這個區塊。'
    relocked: '&c 你的島嶼等級下降 — [count] 個區塊已重新鎖定（由最新認領的開始）。提升等級即可重新奪回！'
    sethome-denied: '&c 你不能在已鎖定的區塊內設定重生點。'
