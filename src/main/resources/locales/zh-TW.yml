protection:
  flags:
    CHUNKBLOCK_MAGIC_BLOCK:
      name: 魔法方塊保護
      description: '<aqua>如果玩家可以破壞方塊，

        則該等級可以破壞

        魔法方塊。</aqua>'
      hint: '<red>你的等級無法破壞魔法方塊！</red>'
    CHUNKBLOCK_START_SAFETY:
      name: 初始安全保護
      description: '<aqua>阻止新玩家在1分鐘內

        移動，以防他們跌落。</aqua>'
      hint: '<red>出於安全考慮，移動已被阻止 [number] 秒！</red>'
      free-to-move: '<green>你可以自由移動了，請小心！</green>'
    CHUNKBLOCK_BOSSBAR:
      name: Boss 血條
      description: '<aqua>為每個階段

        顯示一個狀態條。</aqua>'
    CHUNKBLOCK_ACTIONBAR:
      name: 動作欄
      description: '<aqua>在動作欄中

        顯示每個階段

        的狀態。</aqua>'
    CHUNKBLOCK_CLAIM_CHUNKS:
      name: 認領區塊
      description: '<aqua>可花費島嶼的等級額度

        認領新區塊

        的身分組。</aqua>'
      hint: '<red>你的身分組無法為這座島嶼認領區塊！</red>'
chunkblock:
  bossbar:
    title: 剩餘的塊
    title-prefix: "[title] | "
    status: '<green>階段方塊</green><aqua> [done] </aqua><light_purple>/ </light_purple><aqua>[total]</aqua>'
    color: RED
    style: SEGMENTED_20
    not-active: '<red>此島嶼的 Boss 血條未啟用</red>'
  actionbar:
    status: '<green>階段: </green><aqua>[phase-name] </aqua><light_purple>| </light_purple><green>方塊數: </green><aqua>[done] </aqua><light_purple>/ </light_purple><aqua>[total] </aqua><light_purple>| </light_purple><green>進度: </green><aqua>[percent-done]</aqua>'
    not-active: '<red>該島嶼的動作欄未啟用</red>'
  trophies:
    awarded: '<gold><bold>獲得獎杯: </bold></gold>[name]<gold>!</gold>'
    title-available: '<yellow>你的島嶼獲得了頭銜 </yellow>[title]<yellow> — 使用 </yellow><aqua>/ch title</aqua><yellow> 來開啟或關閉。</yellow>'
  commands:
    ledger:
      description: "顯示團隊成員的貢獻"
      parameters: "[天]"
      header: '<green>島嶼貢獻帳簿 </green><gray>([window])</gray>'
      all-time: "全部時間"
      last-days: "最後 [days] 天"
      row: '<gray> - </gray><aqua>[name]</aqua><gray>: </gray><green>[blocks]</green><gray> 個方塊, </gray><green>[chunks]</green><gray> 個區塊, </gray><green>[rings]</green><gray> 圈</gray>'
      total: '<gold>總計: </gold><green>[blocks]</green><gold> 個方塊, </gold><green>[chunks]</green><gold> 個區塊, </gold><green>[rings]</green><gold> 圈</gold>'
      no-activity: '<gray>尚未記錄任何活動。</gray>'
    title:
      description: "開啟或關閉你島嶼的頭銜，或選擇一個"
      parameters: "[列表 | 獎杯-id | 無]"
      header: '<green>你島嶼的獎杯:</green>'
      trophy-entry: '<gray> - </gray>[name]'
      title-entry: '<gray> - </gray>[name]<gray> — 頭銜 </gray>[title]<gray> (</gray><aqua>/ch title [id]</aqua><gray>)</gray>'
      none-earned-yet: '<gray>你的島嶼還沒有獲得任何獎杯。</gray>'
      active: '<green>活躍的頭銜: </green>[title]'
      no-active: '<gray>沒有活躍的頭銜。用 </gray><aqua>/ch title</aqua><gray> 選擇一個。</gray>'
      set: '<green>你的島嶼的頭銜現在是 </green>[title]<green>。</green>'
      cleared: '<green>你的島嶼不再顯示頭銜。</green>'
      toggled-on: '<green>島嶼頭銜 </green>[title]<green> 現在顯示。</green>'
      toggled-off: '<yellow>島嶼頭銜 </yellow>[title]<yellow> 現在隱藏。</yellow>'
      not-earned: '<red>你的島嶼還沒有獲得這個頭銜的獎杯。</red>'
    admin:
      setcount:
        parameters: <名稱> <計數>
        description: 設定玩家的方塊數量
        set: '<green>[name] 的計數設定為 [number]</green>'
        set-lifetime: '<green>[name] 的生命週期計數設定為 [number]</green>'
      setchest:
        parameters: <階段> <稀有>
        description: 將所看的箱子放在指定稀有度的階段
        chest-is-empty: '<red>該箱子為空，因此無法添加</red>'
        unknown-phase: '<red>未知階段。使用 Tab 鍵自動補全查看</red>'
        unknown-rarity: '<red>未知稀有。使用COMMON，UNCOMMON，RARE或EPIC</red>'
        look-at-chest: '<red>請看向裝滿的箱子</red>'
        only-single-chest: '<red>只能設定單一箱子</red>'
        success: '<green>箱子成功添加</green>'
        failure: '<red>無法將箱子加入該階段！ 請參閱控制台以獲取錯誤</red>'
      sanity:
        parameters: <階段>
        description: 在主控台顯示各階段機率的健全性檢查
        see-console: '<green>請參閱控制台以獲取報告</green>'
      bypass:
        description: 切換你自己是否受區塊鎖定限制
        'off': '<green>區塊鎖定已重新套用在你身上。</green>'
        'on': '<green>你現在可以無視區塊鎖定，且邊界視覺效果對你隱藏。</green>'
      chunks:
        description: 查看玩家已解鎖的區塊，或將其重新鎖回起始狀態
        info: '<green>[name]：</green><aqua> [number]</aqua><green>/</green><aqua>[max] </aqua><green>個區塊，已花費 </green><aqua>[spent] </aqua><green>點等級，剩餘額度 </green><aqua>[credit] </aqua><green>點。</green>'
        parameters: <玩家> [reset]
        reset: '<green>[name] 的區塊已重新鎖回只剩中心區塊。</green>'
      phases:
        description: 開啟階段順序編輯器
        no-index: '<red>尚未載入階段索引，因此無法重新排序階段</red>'
        save-failed: '<red>無法儲存階段順序！請查看主控台錯誤訊息</red>'
        saved: '<green>階段順序已儲存並套用</green>'
        gui:
          cancel-word: cancel
          disabled: '<red>已停用</red>'
          drop-at-end: '<green>放到最後</green>'
          drop-here: '<yellow>點擊以放置於此</yellow>'
          enter-length: '<yellow>請在聊天室輸入 </yellow><green>[name] </green><yellow>的新長度－目前為 </yellow><aqua>[number] </aqua><yellow>個方塊。輸入 </yellow><red>cancel </red><yellow>可保持不變。</yellow>'
          held: '<yellow>移動中：[name]</yellow>'
          info-title: '<white>使用方式</white>'
          instructions: '<gray>點擊一個階段以拿起它，\n 再點擊要放置的位置。\n 右鍵點擊可切換\n 階段的啟用/停用。</gray>'
          invalid-length: '<red>長度必須是大於 0 的整數</red>'
          length: '<gray>長度：</gray><aqua> [number]</aqua>'
          length-cancelled: '<red>長度未變更</red>'
          phase-name: '<green>[name]</green>'
          pick-up: '<yellow>點擊以移動</yellow>'
          put-back: '<yellow>點擊以放回</yellow>'
          repeat: '<gray>最後一個階段結束後，計數將跳至 </gray><aqua>[number]</aqua>'
          set-length: '<yellow>Shift + 左鍵點擊以設定長度</yellow>'
          start: '<gray>起始：</gray><aqua> [number]</aqua>'
          title: '<dark_green>階段順序</dark_green>'
          toggle: '<yellow>右鍵點擊以切換</yellow>'
          version-locked: '<red>需要 Minecraft [version]+</red>'
    count:
      description: 顯示方塊數量與所在階段
      info: '<green>你目前在 [name] </green>階段，已破壞 <aqua>[number] </aqua>個方塊'
    info:
      count: '<green>島位於 </green><aqua>[names] </aqua><green>階段的 </green><aqua>[number]</aqua><green> 區塊。生命週期計數 </green><aqua>[lifetime] </aqua><green>。</green>'
    phases:
      description: 顯示所有階段的列表
      title: '<dark_green>ChunkBlock 階段</dark_green>'
      name-syntax: '<green>[name]</green>'
      description-syntax: '<aqua>[number]塊</aqua>'
    island:
      bossbar:
        description: 切換階段狀態列
        status_on: '<aqua>Bossbar</aqua><green> 打開</green>'
        status_off: '<aqua>Bossbar</aqua><red> 關閉</red>'
      actionbar:
        description: 切換階段動作欄
        status_on: '<aqua>動作欄已 </aqua><green>開啟</green>'
        status_off: '<aqua>動作欄已 </aqua><red>關閉</red>'
      setcount:
        parameters: <計數>
        description: 將區塊計數設定為之前完成的值
        set: '<green>計數設定為 [number]。</green>'
        too-high: '<red>你可以設定的最大值是 [number]！</red>'
    respawn-block:
      description: 在魔法塊消失的情況下重生
      block-exist: '<green>塊存在，不需要重生。我給你標記了。</green>'
      block-respawned: '<green>塊重生。</green>'
    chunks:
      description: 顯示你已解鎖的區塊與你的領土地圖
  phase:
    insufficient-level: '<red>你的島嶼等級太低，無法繼續！必須是[number]。</red>'
