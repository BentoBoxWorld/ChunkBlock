    info: "<green>Чанки: </green><aqua>[unlocked]</aqua><green>/</green><aqua>[max]</aqua><green>. Кредит: </green><aqua>[credit] </aqua><green>рівень(я) — чанк коштує </green><aqua>[cost]</aqua><green>.</green>"
