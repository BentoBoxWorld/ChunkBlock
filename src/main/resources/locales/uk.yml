protection:
  flags:
    CHUNKBLOCK_MAGIC_BLOCK:
      name: Захист Магічного Блоку
      description: |-
        <aqua>Ранг, який може зламати
        магічний блок, якщо
        може ламати блоки.</aqua>
      hint: "<red>Ваш ранг не може зламати магічний блок!</red>"
    CHUNKBLOCK_START_SAFETY:
      name: Початкова Безпека
      description: |-
        <aqua>Запобігає руху нових гравців
        протягом 1 хвилини,
        щоб вони не впали.</aqua>
      hint: "<red>Рух заблоковано з міркувань безпеки ще на [number] секунд!</red>"
      free-to-move: "<green>Ви можете вільно рухатися. Будьте обережні!</green>"
    CHUNKBLOCK_BOSSBAR:
      name: Boss Bar
      description: |-
        <aqua>Показує панель стану
        для кожної фази.</aqua>
    CHUNKBLOCK_ACTIONBAR:
      name: Action Bar
      description: |-
        <aqua>Показує статус
        для кожної фази
        в Action Bar.</aqua>
    CHUNKBLOCK_CLAIM_CHUNKS:
      name: Заявити Чанки
      description: |-
        <aqua>Ранг, який може витратити
        кредит рівня острова на
        заяву нових чанків.</aqua>
      hint: "<red>Ваш ранг не може заявити чанки для цього острова!</red>"
chunkblock:
