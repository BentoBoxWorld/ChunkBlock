      cleared: "<green>A szigeted már nem jelenít meg címet.</green>"
      toggled-on: "<green>Sziget cím </green>[title]<green> most megjelenik.</green>"
      toggled-off: "<yellow>Sziget cím </yellow>[title]<yellow> most rejtett.</yellow>"
      not-earned: "<red>A szigeted nem szerzett trófeát ezzel a címmel.</red>"
