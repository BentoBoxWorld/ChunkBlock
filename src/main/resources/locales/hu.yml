protection:
  flags:
    CHUNKBLOCK_MAGIC_BLOCK:
      name: Mágikus Blokk Védelem
      description: |-
        <aqua>Rang, amely képes
        szétrombolni a mágikus
        blokkot, ha tud blokkokat
        rombolni.</aqua>
      hint: "<red>A rangod nem törheti szét a mágikus blokkot!</red>"
    CHUNKBLOCK_START_SAFETY:
      name: Kezdő Biztonság
      description: |-
        <aqua>Megakadályozza az új játékosokat
        a mozgásban 1 percig,
        hogy ne essenek le.</aqua>
      hint: "<red>Mozgás blokkolva biztonsági okokból még [number] másodpercig!</red>"
      free-to-move: "<green>Szabadon mozoghatsz. Légy óvatos!</green>"
    CHUNKBLOCK_BOSSBAR:
      name: Boss Bar
      description: |-
        <aqua>Állapotjelző sávot
        mutat minden fázishoz.</aqua>
    CHUNKBLOCK_ACTIONBAR:
      name: Műveleti Sáv (Action Bar)
      description: |-
        <aqua>Állapotot mutat
        minden fázishoz
        a Műveleti Sávban.</aqua>
    CHUNKBLOCK_CLAIM_CHUNKS:
      name: Szövegek Igénylése
      description: |-
        <aqua>Rang, amely az sziget
        szintje kreditjét költheti
        új szövegek igényléséhez.</aqua>
      hint: "<red>A rangod nem tudja igényelni a szövegeket erre a szigetre!</red>"
chunkblock:
  bossbar:
    title: Blokkok maradtak
    title-prefix: "[title] | "
    status: '<green>Fázisblokkok </green><aqua>[done] </aqua><light_purple>/ </light_purple><aqua>[total]</aqua>'
    color: RED
    style: SEGMENTED_20
    not-active: '<red>A Boss Bar nem aktív ezen a szigeten</red>'
  actionbar:
    status: "<green>Fázis: </green><aqua>[phase-name] </aqua><light_purple>| </light_purple><green>Blokkok: </green><aqua>[done] </aqua><light_purple>/ </light_purple><aqua>[total] </aqua><light_purple>| </light_purple><green>Haladás: </green><aqua>[percent-done]</aqua>"
    not-active: "<red>Az akciósáv nem aktív ezen a szigeten</red>"
  trophies:
    awarded: "<gold><bold>Trófea szerzett: </bold></gold>[name]<gold>!</gold>"
    title-available: "<yellow>A szigeted megnyerte a </yellow>[title]<yellow> címet — kapcsold ki és be a </yellow><aqua>/ch title</aqua><yellow> paranccsal.</yellow>"
  chunks:
    entry-denied: "<red>Ez a szöveg zárolva van.</red>"
    locked: "<red>Nem érintheted azt — a szöveg zárolva van.</red>"
    claim-hint: "<yellow>Üss a határra ennek a szövegnek az igényléséhez </yellow><aqua>[cost] </aqua><yellow>szint(hez)! Van </yellow><aqua>[credit] </aqua><yellow>szinted kredid.</yellow>"
    claim-confirm: "<yellow>Igényelj ezt a szöveget </yellow><aqua>[cost] </aqua><yellow>szint(ért)? Ez azt hagyja neked </yellow><aqua>[after] </aqua><yellow>szint kredid. </yellow><gold>Lopózz és üss ismét a határra </gold><yellow>belül </yellow><aqua>[seconds]s </aqua><yellow>hogy megerősítsd.</yellow>"
    no-credit: "<red>Szükséged van </red><aqua>[needed] </aqua><red>több szint kreditre ennek a szövegnek az igényléséhez.</red>"
    beyond-limit: "<red>Ez a szöveg a szigeted védelmi területe túl van.</red>"
    claimed: "<green><bold>Szöveg igényelve! </bold>A szigeted most </green><aqua>[number] </aqua><green>szöveg. Megmaradt kredit: </green><aqua>[credit] </aqua><green>szint.</green>"
    credit: "<green>Igényelhetiels </green><aqua>[count] </aqua><green>több szöveget! Menj a hatádhoz és ütsd meg ahol szeretnél növekedni.</green>"
    relocked: "<red>A szigeted szintje csökkent — [count] szöveg lett ismét zárolva, legújabb elsőnek. Szerzj meg a szinteket hogy ismét igényelhesd!</red>"
    ejected: "<red>A szöveg amit benned voltál ismét zárolva lett, így biztonságra kerültél.</red>"
    max-reached: "<light_purple>A szigeted elérte a maximális méretét [number] szöveg!</light_purple>"
    ring-complete: "<gold><bold>Gyűrű [ring] kész! </bold>Az egész gyűrű a szigeted körül a tiéd — </gold><aqua>[chunks] </aqua><gold>szöveg összesen.</gold>"
    ring-broadcast: "<gold>[name] szigete lezárta a gyűrűt </gold><aqua>[ring] </aqua><gold>— </gold><aqua>[chunks] </aqua><gold>szöveg és még növekszik!</gold>"
    rings: "<green>Befejezett gyűrűk: </green><aqua>[rings] </aqua><green>a </green><aqua>[max]</aqua><green> közül.</green>"
    ring-progress: "<yellow>Gyűrű [ring]: </yellow><aqua>[remaining]</aqua><yellow>/</yellow><aqua>[total]</aqua><yellow> szöveg még.</yellow>"
    sethome-denied: "<red>Nem állíthatod be a házad zárolva szövegben.</red>"
    info: "<green>Szövegek: </green><aqua>[unlocked]</aqua><green>/</green><aqua>[max]</aqua><green>. Kredit: </green><aqua>[credit] </aqua><green>szint — egy szöveg költségei </green><aqua>[cost]</aqua><green>.</green>"
    map:
      title: "<green>A szigeted területe ([unlocked]/[max] szövegek):</green>"
      row: "<green>[row]</green>"
      legend: "<green>■ tiéd </green><yellow>▣ igényelhető ([cost] szint mindegyik) </yellow><gray>□ zárolva </gray><gold>◎ közép </gold><aqua>◆ te</aqua>"
      you-are-here: "<aqua>A megjelölt szövegen vagy.</aqua>"
    dialog:
      close: "<white>Bezárás"
      view-island: "<gold>Középre a szigetedre"
      view-player: "<aqua>Középre a pozíciódra"
      pan-north: "<white>Térkép görgetése északra"
      pan-south: "<white>Térkép görgetése délre"
      pan-east: "<white>Térkép görgetése keletre"
      pan-west: "<white>Térkép görgetése nyugatra"
      arrow-to-island: "<gold>A szigeted közepe erre van"
      arrow-to-player: "<aqua>Te erre vagy"
      tooltip:
        center: "<gold>A közép szöveg — a mágikus blokk itt van."
        owned: "<green>Szöveg [x], [z] — tied."
        claimable: "<yellow>Szöveg [x], [z] — igényelhető <aqua>[cost]</aqua> szintért. Menj arra a határra és ütsd meg."
        no-credit: "<yellow>Szöveg [x], [z] — költségei <aqua>[cost]</aqua> szint. Szükséged van <red>[needed]</red> több szint kreditre."
        locked: "<gray>Szöveg [x], [z] — zárolva. Igényelj ki magad oda."
        you-are-here: "<aqua>Itt állsz."
  commands:
    chunks:
      description: "mutasd meg a feloldott szövegeket és a terület térképét"
    ledger:
      description: "mutasd meg a csapat tagjainak hozzájárulásait"
