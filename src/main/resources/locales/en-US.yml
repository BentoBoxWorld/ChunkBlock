###########################################################################################
# This is a YML file. Be careful when editing. Check your edits in a YAML checker like    #
# the one at http://yaml-online-parser.appspot.com                                        #
###########################################################################################

protection:
  flags:
    CHUNKBLOCK_MAGIC_BLOCK:
      name: Magic Block Protection
      description: |-
        <aqua>Rank that can break the magic
        block if they can break blocks.</aqua>
      hint: "<red>Your rank cannot break the magic block!</red>"
    CHUNKBLOCK_CLAIM_CHUNKS:
      name: Claim Chunks
      description: |-
        <aqua>Rank that can spend the
        island's level credit to
        claim new chunks.</aqua>
      hint: "<red>Your rank cannot claim chunks for this island!</red>"
    CHUNKBLOCK_START_SAFETY:
      name: Starting Safety
      description: |-
        <aqua>Prevents new players
        from moving for 1 minute
        so they don't fall off.</aqua>
      hint: "<red>Movement blocked for safety for [number] more seconds!</red>"
      free-to-move: "<green>You are free to move. Be careful!</green>"
    CHUNKBLOCK_BOSSBAR:
      name: Boss Bar
      description: |-
        <aqua>Shows a status bar
        for each phase.</aqua>
    CHUNKBLOCK_ACTIONBAR:
      name: Action Bar
      description: |-
        <aqua>Shows a status
        for each phase
        in the Action Bar.</aqua>

chunkblock:
  chunks:
    entry-denied: "<red>That chunk is locked.</red>"
    locked: "<red>You can't touch that — the chunk is locked.</red>"
    claim-hint: "<yellow>Hit the border to claim this chunk for </yellow><aqua>[cost] </aqua><yellow>level(s)! You have </yellow><aqua>[credit] </aqua><yellow>level(s) of credit.</yellow>"
    claim-confirm: "<yellow>Claim this chunk for </yellow><aqua>[cost] </aqua><yellow>level(s)? That leaves you </yellow><aqua>[after] </aqua><yellow>level(s) of credit. </yellow><gold>Sneak and hit the border again </gold><yellow>within </yellow><aqua>[seconds]s </aqua><yellow>to confirm.</yellow>"
    no-credit: "<red>You need </red><aqua>[needed] </aqua><red>more level(s) of credit to claim this chunk.</red>"
    beyond-limit: "<red>That chunk is beyond your island's protection area.</red>"
    claimed: "<green><bold>[name] claimed a chunk! </bold>Your island is now </green><aqua>[number] </aqua><green>chunks. Credit left: </green><aqua>[credit] </aqua><green>level(s).</green>"
    credit: "<green>You can claim </green><aqua>[count] </aqua><green>more chunk(s)! Go to your border and hit it where you want to grow.</green>"
    relocked: "<red>Your island level dropped — [count] chunk(s) re-locked, newest first. Regain the levels to claim them back!</red>"
    ejected: "<red>The chunk you were in re-locked, so you were moved to safety.</red>"
    max-reached: "<light_purple>Your island has reached its maximum size of [number] chunks!</light_purple>"
    ring-complete: "<gold><bold>Ring [ring] complete! </bold>The whole ring around your island is yours — </gold><aqua>[chunks] </aqua><gold>chunks in all.</gold>"
    ring-broadcast: "<gold>[name]'s island has closed ring </gold><aqua>[ring] </aqua><gold>— </gold><aqua>[chunks] </aqua><gold>chunks and still growing!</gold>"
    rings: "<green>Rings completed: </green><aqua>[rings] </aqua><green>of </green><aqua>[max]</aqua><green>.</green>"
    ring-progress: "<yellow>Ring [ring]: </yellow><aqua>[remaining]</aqua><yellow>/</yellow><aqua>[total]</aqua><yellow> chunks to go.</yellow>"
    sethome-denied: "<red>You can't set a home in a locked chunk.</red>"
    info: "<green>Chunks: </green><aqua>[unlocked]</aqua><green>/</green><aqua>[max]</aqua><green>. Credit: </green><aqua>[credit] </aqua><green>level(s) — a chunk costs </green><aqua>[cost]</aqua><green>.</green>"
    map:
      title: "<green>Your island territory ([unlocked]/[max] chunks):</green>"
      row: "<green>[row]</green>"
      legend: "<green>■ yours </green><yellow>▣ claimable ([cost] level(s) each) </yellow><gray>□ locked </gray><gold>◎ center </gold><aqua>◆ you</aqua>"
      you-are-here: "<aqua>You are on the marked chunk.</aqua>"
    # The map dialog: one button per chunk. Tooltips show when the mouse is over a chunk.
    # These are MiniMessage, which is what new text should use — the old &-codes still work.
    dialog:
      close: "<white>Close"
      view-island: "<gold>Center on your island"
      view-player: "<aqua>Center on your position"
      arrow-to-island: "<gold>Your island center is this way"
      arrow-to-player: "<aqua>You are this way"
      tooltip:
        center: "<gold>The center chunk — your magic block is here."
        owned: "<green>Chunk [x], [z] — yours."
        claimable: "<yellow>Chunk [x], [z] — claimable for <aqua>[cost]</aqua> level(s). Go to that border and hit it."
        no-credit: "<yellow>Chunk [x], [z] — costs <aqua>[cost]</aqua> level(s). You need <red>[needed]</red> more level(s) of credit."
        locked: "<gray>Chunk [x], [z] — locked. Claim your way out to it."
        you-are-here: "<aqua>You are standing here."
  bossbar:
    title: "Blocks remaining"
    # status: "&a Phase blocks &b [total]. Blocks left: [todo]"
    # status: "&a [phase-name] : [percent-done]"
    title-prefix: "[title] | "
    status: "[island-title]<green>Phase blocks </green><aqua>[done] </aqua><light_purple>/ </light_purple><aqua>[total]</aqua>"
    # RED, WHITE, PINK, BLUE, GREEN, YELLOW, or PURPLE
    color: RED
    # SOLID, SEGMENTED_6,  SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
    style: SOLID
    not-active: "<red>Boss Bar is not active for this island</red>"
  actionbar:
    status: "<green>Phase: </green><aqua>[phase-name] </aqua><light_purple>| </light_purple><green>Blocks: </green><aqua>[done] </aqua><light_purple>/ </light_purple><aqua>[total] </aqua><light_purple>| </light_purple><green>Progression: </green><aqua>[percent-done]</aqua>"
    not-active: "<red>Action Bar is not active for this island</red>"
  trophies:
    awarded: "<gold><bold>Trophy earned: </bold></gold>[name]<gold>!</gold>"
    title-available: "<yellow>Your island earned the title </yellow>[title]<yellow> — toggle it on and off using </yellow><aqua>/ch title</aqua><yellow>.</yellow>"
  commands:
    chunks:
      description: "show your unlocked chunks and a map of your territory"
    ledger:
      description: "show team member contributions"
      parameters: "[days]"
      header: "<green>Island Contribution Ledger </green><gray>([window])</gray>"
      all-time: "all time"
      last-days: "last [days] days"
      row: "<gray> - </gray><aqua>[name]</aqua><gray>: </gray><green>[blocks]</green><gray> blocks, </gray><green>[chunks]</green><gray> chunks, </gray><green>[rings]</green><gray> rings</gray>"
      total: "<gold>Total: </gold><green>[blocks]</green><gold> blocks, </gold><green>[chunks]</green><gold> chunks, </gold><green>[rings]</green><gold> rings</gold>"
      no-activity: "<gray>No activity recorded yet.</gray>"
    title:
      description: "toggle your island's title on/off, or choose one"
      parameters: "[list | trophy-id | none]"
      header: "<green>Your island's trophies:</green>"
      trophy-entry: "<gray> - </gray>[name]"
      title-entry: "<gray> - </gray>[name]<gray> — title </gray>[title]<gray> (</gray><aqua>/ch title [id]</aqua><gray>)</gray>"
      none-earned-yet: "<gray>Your island has not earned any trophies yet.</gray>"
      active: "<green>Active title: </green>[title]"
      no-active: "<gray>No title is active. Pick one with </gray><aqua>/ch title</aqua><gray>.</gray>"
      set: "<green>Your island's title is now </green>[title]<green>.</green>"
      cleared: "<green>Your island no longer shows a title.</green>"
      toggled-on: "<green>Island title </green>[title]<green> is now showing.</green>"
      toggled-off: "<yellow>Island title </yellow>[title]<yellow> is now hidden.</yellow>"
      not-earned: "<red>Your island has not earned a trophy with that title.</red>"
    admin:
      chunks:
        parameters: "<player> [reset]"
        description: "inspect a player's unlocked chunks or re-lock them back to the start"
        info: "<green>[name]: </green><aqua>[number]</aqua><green>/</green><aqua>[max] </aqua><green>chunks, </green><aqua>[spent] </aqua><green>level(s) spent, </green><aqua>[credit] </aqua><green>credit.</green>"
        reset: "<green>[name]'s chunks were re-locked back to just the center chunk.</green>"
      bypass:
        description: "toggle chunk lock enforcement for yourself"
        "on": "<green>You now bypass chunk locks. Border visuals are hidden for you.</green>"
        "off": "<green>Chunk locks apply to you again.</green>"
      setcount:
        parameters: "<name> <count> [lifetime]"
        description: "set player's block count"
        set: "<green>[name]'s count set to [number]</green>"
        set-lifetime: "<green>[name]'s lifetime count set to [number]</green>"
      setchest:
        parameters: "<phase> <rarity>"
        description: "put the looked-at chest in a phase with the rarity specified"
        chest-is-empty: "<red>That chest is empty so cannot be added</red>"
        unknown-phase: "<red>Unknown phase. Use tab-complete to see them</red>"
        unknown-rarity: "<red>Unknown rarity. Use COMMON, UNCOMMON, RARE or EPIC</red>"
        look-at-chest: "<red>Look at a filled chest to set it</red>"
        only-single-chest: "<red>Only single chests can be set</red>"
        success: "<green>Chest successfully added to phase</green>"
        failure: "<red>Chest could not be added to the phase! See console for errors</red>"
      sanity:
        parameters: "<phase>"
        description: "display a sanity check of the phase probabilities in the console"
        see-console: "<green>See the console for the report</green>"
      phases:
        description: "open the phase order editor"
        no-index: "<red>No phase index is loaded, so phases cannot be reordered</red>"
        saved: "<green>Phase order saved and applied</green>"
        save-failed: "<red>Could not save the phase order! See console for errors</red>"
        gui:
          title: "<dark_green>Phase Order</dark_green>"
          info-title: "<white>How to use</white>"
          instructions: |-
            <gray>Click a phase to pick it up,
            then click where it should go.
            Right-click toggles a phase
            on or off.</gray>
          repeat: "<gray>After the last phase the count jumps to </gray><aqua>[number]</aqua>"
          phase-name: "<green>[name]</green>"
          start: "<gray>Start: </gray><aqua>[number]</aqua>"
          length: "<gray>Length: </gray><aqua>[number]</aqua>"
          disabled: "<red>Disabled</red>"
          version-locked: "<red>Needs Minecraft [version]+</red>"
          pick-up: "<yellow>Click to move</yellow>"
          toggle: "<yellow>Right-click to toggle</yellow>"
          set-length: "<yellow>Shift-left-click to set length</yellow>"
          drop-here: "<yellow>Click to drop here</yellow>"
          drop-at-end: "<green>Drop at the end</green>"
          held: "<yellow>Moving: [name]</yellow>"
          put-back: "<yellow>Click to put back</yellow>"
          enter-length: "<yellow>Enter a new length in chat for </yellow><green>[name] </green><yellow>- it is currently </yellow><aqua>[number] </aqua><yellow>blocks. Type </yellow><red>cancel </red><yellow>to keep it.</yellow>"
          invalid-length: "<red>The length must be a whole number above 0</red>"
          length-cancelled: "<red>Length unchanged</red>"
          cancel-word: "cancel"
    count:
      description: show the block count and phase
      info: "<green>You are on block </green><aqua>[number] in the </aqua><green>[name] phase</green>"
    info:
      count: "<green>Island is on block </green><aqua>[number] </aqua><green>in the </green><aqua>[name] </aqua><green>phase. Lifetime count </green><aqua>[lifetime] </aqua><green>.</green>"
    phases:
      description: show a list of all the phases
      title: "<dark_green>ChunkBlock Phases</dark_green>"
      name-syntax: "<green>[name]</green>"
      description-syntax: "<aqua>[number] blocks</aqua>"
    island:
      bossbar:
        description: "toggles phase boss bar"
        status_on: "<aqua>Bossbar turned </aqua><green>on</green>"
        status_off: "<aqua>Bossbar turned </aqua><red>off</red>"
      actionbar:
        description: "toggles phase action bar"
        status_on: "<aqua>Action Bar turned </aqua><green>on</green>"
        status_off: "<aqua>Action Bar turned </aqua><red>off</red>"
      setcount:
        parameters: "<count>"
        description: "set block count to previously completed value"
        set: "<green>Count set to [number].</green>"
        too-high: "<red>The maximum you can set is [number]!</red>"
    respawn-block:
      description: "respawns magic block in situations when it disappears"
      block-exist: "<green>Block exists, did not require respawning. I marked it for you.</green>"
      block-respawned: "<green>Block respawned.</green>"
  phase:
    insufficient-level: "<red>Your island level is too low to proceed! It must be [number].</red>"
    insufficient-funds: "<red>Your funds are too low to proceed! They must be [number].</red>"
    insufficient-bank-balance: "<red>The island bank balance is too low to proceed! It must be [number].</red>"
    insufficient-permission: "<red>You can proceed no further until you obtain the [name] permission!</red>"
    cooldown: "<red>Next phase will be available in [number] seconds!</red>"
  placeholders:
    infinite: Infinite
    my-island-phase-default: Unknown
  gui:
    titles:
      phases: '<black><bold>ChunkBlock Phases</bold></black>'
    # This section contains all button names and lore (description)
    buttons:
      # List of buttons in GUI's
      # Button that is used in multipage GUIs which allows to return to previous page.
      previous:
        name: "<white><bold>Previous Page</bold></white>"
        description: |-
          <gray>Switch to [number] page</gray>
      # Button that is used in multipage GUIs which allows to go to next page.
      next:
        name: "<white><bold>Next Page</bold></white>"
        description: |-
          <gray>Switch to [number] page</gray>
      phase:
        name: "<white><bold>[phase]</bold></white>"
        description: |-
          [starting-block]
          [biome]
          [bank]
          [economy]
          [level]
          [permission]
          [blocks]
        # Replaces text with [starting-block]
        starting-block: "<gray>Starts after breaking </gray><yellow>[number] blocks.</yellow>"
        # Replaces text with [biome]
        biome: "<gray>Biome: </gray><yellow>[biome]</yellow>"
        # Replaces text with [bank]
        bank: "<gray>Requires </gray><yellow>$[number] </yellow><gray>in bank account.</gray>"
        # Replaces text with [economy]
        economy: "<gray>Requires </gray><yellow>$[number] </yellow><gray>in player account.</gray>"
        # Replaces text with [level]
        level: "<gray>Requires </gray><yellow>[number] </yellow><gray>island level.</gray>"
        # Replaces text with [permission]
        permission: "<gray>Requires `</gray><yellow>[permission]</yellow><gray>` permission.</gray>"
        # Replaces text with [blocks]
        blocks-prefix: '<gray>Blocks in phase - </gray>'
        blocks: '<yellow>[name], </yellow>'
        wrap-at: '50'
    tips:
      click-to-previous: "<yellow>Click </yellow><gray>to view previous page.</gray>"
      click-to-next: "<yellow>Click </yellow><gray>to view next page.</gray>"
      click-to-change: "<yellow>Click </yellow><gray>to change.</gray>"
  island:
    starting-hologram: "<green>Welcome to ChunkBlock\n</green><yellow>Break This Block to Begin</yellow>"
